{% extends "base.html" %}
{% block title %}Your notes{% endblock %}
{% block content %}
<h1>Your notes</h1>
<form method="get" action="{{ url_for('notes.index') }}">
  <input name="q" value="{{ q }}" placeholder="Search titles">
  <button type="submit">Search</button>
</form>
<ul>
  {% for note in notes %}
    <li><a href="{{ url_for('notes.view', note_id=note['id']) }}">{{ note['title'] }}</a></li>
  {% else %}
    <li>No notes found.</li>
  {% endfor %}
</ul>
{% endblock %}
